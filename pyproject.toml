[project]
name = "asymmetric-society"
version = "0.1.0"
description = "Capability heterogeneity, strategic exploitation, and welfare inequality in LLM agent populations"
authors = [{ name = "Francesco Marko Livaić" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # LLM clients
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "google-generativeai>=0.8.0",
    "ollama>=0.4.0",
    # Data & persistence
    "pandas>=2.2",
    "numpy>=1.26",
    # Statistics & ML
    "scipy>=1.14",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    # Network analysis
    "networkx>=3.3",
    "python-louvain>=0.16",
    # Visualization (analysis scripts)
    "matplotlib>=3.9",
    "seaborn>=0.13",
    # Config & utilities
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
    "google-genai>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asymmetric_society"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
